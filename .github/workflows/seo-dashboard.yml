name: SEO Dashboard Update

on:
  schedule:
    # 毎日 07:00 JST (= 前日 22:00 UTC)。GA4/SCのデータ確定ラグを見込んで前日までを集計する
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-analytics-data google-api-python-client google-auth

      - name: Update SEO dashboard spreadsheet
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SHEETS_ID: ${{ vars.SHEETS_ID }}
        run: python3 scripts/seo-dashboard.py
